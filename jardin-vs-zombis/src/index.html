<html lang="es">
<head>
<meta charset="utf-8">

<title>Jardín vs. Zombis 2</title>
<style>
:root{--bg:#efe9d6;--ink:#2b2a1f}

html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
canvas{width:100%;max-width:900px;height:auto;border-radius:10px;touch-action:manipulation;cursor:pointer}
p{margin:0;font-size:15px;text-align:center;max-width:700px}

/* ---- Ajustes solo para la app Android (pantalla completa, horizontal) ---- */
html,body{height:100%;overflow:hidden;background:#1d2318;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{padding:0;gap:0;justify-content:center}
p{display:none}
canvas{width:min(100vw,calc(100vh * 1.5));height:auto;max-width:none;border-radius:0;display:block}
</style>
</head>
<body>
<canvas id="c" width="900" height="600"></canvas>
<p>Elige una planta y toca una casilla para plantarla. Toca los soles para recogerlos. Cada nivel desbloquea una planta nueva. La pala quita plantas y el guante las mueve. ¡Las podadoras te salvan una vez por carril!</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=900,H=600,X0=60,Y0=90,CW=90,CH=92,ROWS=5,COLS=9;
const ORDER=['girasol','pea','nuez','cereza','mina','hielo','seta','solar','repe','bumeran','pinchos','jalapeno','melon','helada','nenufar','maiz'];

 girasol:{name:'Girasol',cost:50,cd:4,hp:100},

 {n:'Noche en el jardín',g:['#2f4d3a','#38593f'],sky:0,sun:150,hp:1.1,night:1},
 {n:'Desierto de las momias',g:['#d9b873','#e3c585'],sky:1,sun:100,hp:1.3},
 {n:'Cumbres heladas',g:['#bfe3f2','#cdeaf6'],sky:1,sun:100,hp:1.45},
 {n:'Castillo del terror',g:['#4a3d63','#54466f'],sky:0,sun:175,hp:1.6,night:1},
 {n:'Piscina del pánico',g:['#8ccf6a','#97d874'],sky:1,sun:100,hp:1.75,pool:1}
];
let done=0,coins=0,U={sun:0,cd:0,slots:0},best={};
try{done=+localStorage.getItem('jvz2')||0;coins=+localStorage.getItem('jvz2c')||0;U=Object.assign(U,JSON.parse(localStorage.getItem('jvz2u')||'{}'));best=JSON.parse(localStorage.getItem('jvz2b')||'{}')}catch(e){}
function save(){try{localStorage.setItem('jvz2',done);localStorage.setItem('jvz2c',coins);localStorage.setItem('jvz2u',JSON.stringify(U));localStorage.setItem('jvz2b',JSON.stringify(best))}catch(e){}}
function addCoins(n){coins+=n;save()}
const SHOP=[
 {k:'sun',n:'Soles iniciales',d:['+25 soles al empezar','cada nivel (hasta 4 veces)'],max:4,cost:[100,200,300,400],icon:'sun'},
 {k:'cd',n:'Recarga rápida',d:['Las plantas se recargan','10% más rápido por nivel'],max:4,cost:[150,300,450,600],icon:'clock'},
 {k:'slots',n:'Ranura extra',d:['Lleva una planta más','a cada nivel'],max:2,cost:[300,600],icon:'slot'},
 {k:'cannon',n:'Mazorcañón',d:['Une dos Maíz-pult o Melón-pult','vecinos: ¡explosiones enormes!'],max:1,cost:[700],icon:'cannon',op:1},
 {k:'rabogato',n:'Rabogato',d:['Va sobre un Nenúfar. Lanza púas','que persiguen al zombi más cercano'],max:1,cost:[600],icon:'rabogato',op:1},
 {k:'imitador',n:'Imitador',d:['Copia cualquier planta del','juego (recarga más lenta)'],max:1,cost:[500],icon:'imitador',op:1}
];
const SN=['Jardín','Noche','Desierto','Cumbres','Castillo','Piscina'];
const MINIS=[
 {name:'Último batallón',last:1,inf:0,wi:0,dif:5,waves:5,reward:80,row:0,col:0,need:3,key:'ult'},
 {name:'Último batallón infinito',last:1,inf:1,wi:0,dif:5,row:0,col:1,need:3,key:'ulti'}
];
WORLDS.forEach((w,i)=>{
 MINIS.push({name:'Supervivencia: '+w.n,last:0,inf:0,wi:i,dif:i*3+1,waves:5,reward:60+i*20,row:1,col:i,need:i*3,key:'sv'+i});
 MINIS.push({name:'Infinita: '+w.n,last:0,inf:1,wi:i,dif:i*3+1,row:2,col:i,need:i*3,key:'inf'+i});
});

function mrect(m){return m.row===0?[24+m.col*354,112,340,80]:[20+m.col*146,m.row===1?246:380,138,92]}
const IZL=[
 {sun:250,rows:['g.p...','..p...','gn....','..p...','g.....']},
 {sun:300,rows:['g.p.n.','.gp.n.','..h.n.','g.p...','..s...']},
 {sun:350,rows:['gsp.n.','.gh.n.','gsr.n.','.sp.n.','g.m.n.']},
 {sun:450,rows:['gprhnn','gsrmnn','.gbrnn','gsrhnn','gpmrnn']},
 {sun:700,rows:['grrmnn','gnrbnn','grmhnn','gnrbnn','grrmnn']}
];
const IC={g:'girasol',p:'pea',n:'nuez',h:'hielo',s:'pinchos',m:'melon',r:'repe',b:'bumeran'};
const ZC=[{t:0,cost:50},{t:3,cost:75},{t:1,cost:75},{t:4,cost:100},{t:2,cost:125},{t:5,cost:175},{t:6,cost:400}];
function startI(lv){
 start(lv*3,[],null);
 const L=IZL[lv];
 S.izm={lv};S.ret='mini';S.avail=[];S.sun=L.sun;S.mowers=[];S.total=1e9;S.skyT=1e9;S.spawnT=1e9;S.brains=[1,1,1,1,1];S.zsel=null;
 L.rows.forEach((row,r)=>[...row].forEach((ch,c)=>{const id=IC[ch];if(id)S.plants.push({type:id,r,c,hp:P[id].hp,t:id==='girasol'?1e9:Math.random(),arm:0,age:1})}));
}
function imList(){return ORDER.concat(OPS.filter(k=>U[k]&&k!=='imitador'))}
let S={mode:'home'};

function start(idx,chosen,mini){
 const w=WORLDS[idx/3|0];
 S={mode:'play',idx,wi:idx/3|0,dead:[],w,avail:chosen,sun:w.sun,plants:[],zombies:[],peas:[],suns:[],fx:[],
    cd:{},sel:null,hover:null,spawned:0,killed:0,total:8+idx*3,spawnT:12,skyT:w.sky?5:1e9,time:0,over:null,msg:'',msgT:0,tool:null,held:null,mouse:{x:0,y:0},mowers:[0,1,2,3,4].map(r=>({r,x:30,on:false,gone:false}))};
 S.ret=mini?'mini':'menu';S.mini=mini||null;S.sun+=U.sun*25;
 if(mini){
  S.total=mini.inf?1e9:Array.from({length:mini.waves},(_,n)=>wsz(mini,n)).reduce((a,b)=>a+b,0);
  S.wave=0;S.nextWave=wsz(mini,0);S.prep=!!mini.last;S.spawnT=mini.last?1:5;
  if(mini.last){S.sun=1500+U.sun*25;S.skyT=1e9;S.mowers=[]}
 }
}
const cx=c=>X0+c*CW+CW/2, cy=r=>Y0+r*CH+CH/2;
const plantAt=(r,c)=>S.plants.find(p=>!p.base&&p.r===r&&(p.c===c||(p.w2&&p.c+1===c)));

function circ(x,y,r,col){ctx.save();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore()}

function drawPlant(type,x,y,s,wob){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 const w=Math.sin(wob||0)*2;
 ctx.strokeStyle='#2f6b2a';ctx.lineWidth=6;ctx.lineCap='round';
 if(type==='nuez'){
  ctx.fillStyle='#b98342';ctx.strokeStyle='#7a5224';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(0,0,26,34,0,0,7);ctx.fill();ctx.stroke();
  circ(-9,-6,6,'#fff');circ(9,-6,6,'#fff');circ(-8,-6,2.5,'#222');circ(10,-6,2.5,'#222');
  ctx.beginPath();ctx.arc(0,10,8,0.2,2.9);ctx.stroke();
 }else if(type==='cereza'){
  ctx.beginPath();ctx.moveTo(-14,-10);ctx.quadraticCurveTo(0,-34,14,-10);ctx.stroke();
  circ(-16,6,20,'#c8202f');circ(16,6,20,'#d92b3a');
  ctx.fillStyle='#fff';ctx.fillRect(-23,-2,12,7);ctx.fillRect(10,-2,12,7);
  ctx.fillStyle='#222';ctx.fillRect(-18,0,4,5);ctx.fillRect(16,0,4,5);
  ctx.beginPath();ctx.moveTo(-26,-6);ctx.lineTo(-10,0);ctx.moveTo(26,-6);ctx.lineTo(10,0);ctx.lineWidth=3;ctx.strokeStyle='#222';ctx.stroke();
 }else if(type==='mina'){
  ctx.fillStyle='#7a5a3a';ctx.beginPath();ctx.ellipse(0,18,30,16,0,Math.PI,0);ctx.fill();
  circ(0,2,5,P_armed?'#e33':'#a55');
 }else if(type==='seta'){
  ctx.fillStyle='#e8dcc4';ctx.fillRect(-7,6,14,24);
  ctx.fillStyle='#7b4fb0';ctx.beginPath();ctx.ellipse(0,6,26,20,0,Math.PI,0);ctx.fill();
  circ(-10,-6,4,'#fff');circ(8,-10,4,'#fff');circ(0,-1,3,'#fff');
  circ(-5,16,2,'#222');circ(5,16,2,'#222');
 }else if(type==='nenufar'){
  ctx.fillStyle='#3f9a35';ctx.beginPath();ctx.ellipse(0,26,34,12,0,0.3,Math.PI*2-0.3);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.stroke();circ(8,24,4,'#f4a6c8');
 }else if(type==='maiz'){
  ctx.beginPath();ctx.moveTo(0,34);ctx.quadraticCurveTo(w,18,0,6);ctx.stroke();
  ctx.fillStyle='#3f8a35';ctx.beginPath();ctx.ellipse(-14,28,13,6,-0.5,0,7);ctx.ellipse(14,28,13,6,0.5,0,7);ctx.fill();
  ctx.fillStyle='#f5d442';ctx.beginPath();ctx.ellipse(0,-10,17,26,0,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#d9b020';for(let i=-1;i<=1;i++)for(let j=-2;j<=1;j++)ctx.fillRect(i*8-3,j*9-8,6,6);
  ctx.fillStyle='#4aa03a';ctx.beginPath();ctx.moveTo(-18,6);ctx.lineTo(0,22);ctx.lineTo(18,6);ctx.lineTo(0,-2);ctx.fill();
  circ(-6,-18,3,'#222');circ(6,-18,3,'#222');
 }else if(type==='cannon'){
  ctx.fillStyle='#6b5a2a';ctx.fillRect(-60,12,120,16);
  ctx.fillStyle='#3f8a35';ctx.beginPath();ctx.ellipse(-44,30,22,8,0,0,7);ctx.ellipse(44,30,22,8,0,0,7);ctx.fill();
  ctx.fillStyle='#f5d442';ctx.beginPath();ctx.ellipse(0,-6,62,24,-0.12,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#d9b020';for(let i=-6;i<=6;i++){ctx.fillRect(i*9-3,-14,6,6);ctx.fillRect(i*9-3,0,6,6)}
  circ(64,-12,12,'#8a6a3a');circ(-34,-8,6,'#fff');circ(-34,-8,2.5,'#222');circ(-18,-8,6,'#fff');circ(-18,-8,2.5,'#222');
 }else if(type==='rabogato'){
  ctx.beginPath();ctx.moveTo(0,34);ctx.quadraticCurveTo(w+6,10,0,-10);ctx.stroke();
  ctx.fillStyle='#8a5a3a';ctx.beginPath();ctx.ellipse(0,-22,11,26,0,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(-12,-36+i*8);ctx.lineTo(-22,-38+i*8);ctx.lineTo(-12,-32+i*8);ctx.fill();ctx.beginPath();ctx.moveTo(12,-36+i*8);ctx.lineTo(22,-38+i*8);ctx.lineTo(12,-32+i*8);ctx.fill()}
  circ(-4,-24,2.5,'#fff');circ(4,-24,2.5,'#fff');
 }else if(type==='imitador'){
  circ(0,2,26,'#b79ae0');circ(-8,-6,5,'#fff');circ(8,-6,5,'#fff');circ(-7,-6,2,'#222');circ(9,-6,2,'#222');txt('?',0,22,26,'center','#fff');
 }else if(type==='jalapeno'){
  ctx.fillStyle='#d6261c';ctx.beginPath();ctx.ellipse(0,6,18,32,0,0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#2f8a2a';ctx.fillRect(-9,-30,18,8);
  ctx.fillStyle='#fff';ctx.fillRect(-12,-6,9,6);ctx.fillRect(3,-6,9,6);ctx.fillStyle='#222';ctx.fillRect(-8,-5,3,5);ctx.fillRect(7,-5,3,5);
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-13,-10);ctx.lineTo(-3,-6);ctx.moveTo(13,-10);ctx.lineTo(3,-6);ctx.stroke();
 }else if(type==='helada'){
  ctx.fillStyle='#e8f3fa';ctx.fillRect(-7,8,14,22);
  ctx.fillStyle='#6ec3e8';ctx.beginPath();ctx.ellipse(0,8,26,22,0,Math.PI,0);ctx.fill();
  circ(-10,-4,4,'#fff');circ(8,-8,4,'#fff');circ(0,0,3,'#fff');circ(-5,18,2,'#222');circ(5,18,2,'#222');
 }else if(type==='pinchos'){
  ctx.fillStyle='#4a3a2a';ctx.beginPath();ctx.ellipse(0,26,34,10,0,0,7);ctx.fill();
  ctx.fillStyle='#b8c2cc';for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*9-5,26);ctx.lineTo(i*9,6+Math.abs(i));ctx.lineTo(i*9+5,26);ctx.fill()}
 }else if(type==='melon'){
  ctx.beginPath();ctx.moveTo(0,34);ctx.quadraticCurveTo(w,18,0,6);ctx.stroke();
  ctx.fillStyle='#3f8a35';ctx.beginPath();ctx.ellipse(-14,28,13,6,-0.5,0,7);ctx.ellipse(14,28,13,6,0.5,0,7);ctx.fill();
  circ(0,-6,27,'#4aa13a');ctx.strokeStyle='#2f7a2a';ctx.lineWidth=3;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*14,-6,15,Math.PI*.6,Math.PI*1.4);ctx.stroke()}
  circ(-8,-12,5,'#fff');circ(10,-12,5,'#fff');circ(-7,-12,2,'#222');circ(11,-12,2,'#222');
 }else if(type==='solar'){
  ctx.fillStyle='#f3e6c8';ctx.fillRect(-6,8,12,22);
  circ(0,0,26,'rgba(255,200,60,.3)');
  ctx.fillStyle='#f59b0a';ctx.beginPath();ctx.ellipse(0,6,22,17,0,Math.PI,0);ctx.fill();
  circ(0,-9,9,'#ffd23a');circ(-4,18,2,'#222');circ(4,18,2,'#222');
 }else{
  ctx.beginPath();ctx.moveTo(0,34);ctx.quadraticCurveTo(w,16,0,4);ctx.stroke();
  ctx.fillStyle='#3f8a35';ctx.beginPath();ctx.ellipse(-12,28,12,6,-0.5,0,7);ctx.ellipse(12,28,12,6,0.5,0,7);ctx.fill();
  if(type==='girasol'){
   ctx.fillStyle='#f6c223';
   for(let i=0;i<10;i++){const a=i*Math.PI/5;ctx.beginPath();ctx.ellipse(Math.cos(a)*22,-6+Math.sin(a)*22,10,6,a,0,7);ctx.fill()}
   circ(0,-6,15,'#7a4a1b');circ(-5,-9,2.2,'#222');circ(5,-9,2.2,'#222');
   ctx.strokeStyle='#222';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,-4,5,0.2,2.9);ctx.stroke();
  }else{
   const col=type==='hielo'?'#6ecbe8':type==='repe'?'#3f9a35':type==='bumeran'?'#5b86e8':'#58b947';
   circ(-2,-8,22,col);circ(-9,-16,6,'rgba(255,255,255,.28)');
   ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(22,-5,12,10,0,0,7);ctx.fill();
   if(type==='repe'){ctx.beginPath();ctx.ellipse(18,-18,11,8,0,0,7);ctx.fill()}
   circ(31,-5,5,'#2a5a30');circ(5,-16,6.5,'#fff');circ(7,-16,3,'#222');
   if(type==='bumeran'){ctx.strokeStyle='#f5c518';ctx.lineWidth=7;ctx.beginPath();ctx.arc(12,-28,16,Math.PI*.9,Math.PI*1.9);ctx.stroke()}
  }
 }
 ctx.restore();
}
let P_armed=false;

function drawZombie(z,yy){
 const x=z.x,y=yy??cy(z.r),b=Math.sin(S.time*(z.type===3?9:5)+z.ph)*3,skin=S.wi===2?'#c9b27a':S.wi===3?'#a9cfe0':'#9bb58a';
 ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x,y+46,z.type===6?33:22,7,0,0,7);ctx.fill();
 ctx.save();ctx.translate(x,y+b-(z.air>0?30:0));if(z.type===6)ctx.scale(1.45,1.45);if(z.type===8&&!z.eating)ctx.globalAlpha=.55;
 ctx.fillStyle=['#4a4f63','#4a4f63','#4a4f63','#b03030','#3b6bb5','#a02020','#6a4a3a','#3aa0c8','#2a4a70','#2a6a9a'][z.type];ctx.fillRect(-14,0,28,32);
 ctx.fillStyle='#34384a';ctx.fillRect(-14,30,12,14);ctx.fillRect(2,30,12,14);
 ctx.strokeStyle=skin;ctx.lineWidth=8;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-12,8);ctx.lineTo(-38,z.eating?2:12);ctx.stroke();
 circ(0,-14,18,skin);circ(-7,-17,5,'#fff');circ(6,-17,5,'#fff');circ(-8,-17,2,'#222');circ(5,-17,2,'#222');
 ctx.fillStyle='#222';ctx.fillRect(-8,-6,14,3);
 if(z.type===1){ctx.fillStyle='#e0762b';ctx.beginPath();ctx.moveTo(-14,-26);ctx.lineTo(0,-52);ctx.lineTo(14,-26);ctx.fill()}
 if(z.type===2){ctx.fillStyle='#8e949c';ctx.fillRect(-16,-46,32,24);ctx.fillStyle='#6b7078';ctx.fillRect(-19,-26,38,5)}
 if(z.type===4&&!z.jumped){ctx.strokeStyle='#8a5a2a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-32,-34);ctx.lineTo(-32,44);ctx.stroke()}
 if(z.type===5){ctx.fillStyle='#b01e1e';ctx.beginPath();ctx.arc(0,-18,20,Math.PI,0);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-3,-38,6,18)}
 if(z.type===6){ctx.fillStyle='#8a2a2a';ctx.fillRect(-14,0,28,6);ctx.fillStyle='#5a3a2a';ctx.fillRect(30,-8,14,50)}
 if(z.type===7){ctx.strokeStyle='#ffd23a';ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(0,26,24,10,0,0,7);ctx.stroke();circ(-26,20,7,'#ffd23a')}
 if(z.type===8){ctx.fillStyle='#2a6fb0';ctx.fillRect(-14,-26,28,9);ctx.strokeStyle='#e33';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(14,-22);ctx.lineTo(22,-46);ctx.stroke()}
 if(z.type===9){ctx.fillStyle='#4a8fc8';ctx.beginPath();ctx.ellipse(0,38,40,13,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-4,26);ctx.lineTo(6,14);ctx.lineTo(12,28);ctx.fill();circ(34,34,3,'#fff')}
 if(S.wi===2&&z.type===0){ctx.fillStyle='#e8e0c0';ctx.fillRect(-16,-22,32,5);ctx.fillRect(-14,12,28,4)}
 if(z.slow>0){ctx.fillStyle='rgba(110,203,232,.45)';ctx.fillRect(-20,-48,40,96)}
 ctx.restore();
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x-16,y-62,32,4);
 ctx.fillStyle='#c33';ctx.fillRect(x-16,y-62,32*Math.max(0,z.hp/z.max),4);
}

 }
 if(S.tool==='pala'&&pl){S.plants.splice(S.plants.indexOf(pl),1);return}
 if(S.tool==='guante'&&pl){S.held=pl;S.plants.splice(S.plants.indexOf(pl),1);return}
 if(S.sel){
  const k=P[S.sel],ck=S.imit?'imitador':S.sel,pad=S.plants.find(q=>q.base&&q.r===ce.r&&q.c===ce.c),water=S.w.pool&&(ce.r===2||ce.r===3);
  let ok=S.sun>=k.cost&&!(S.cd[ck]>0),fuse=null;
  if(S.sel==='cannon'){
   const isC=q=>q&&(q.type==='maiz'||q.type==='melon');
   fuse=[ce.c-1,ce.c+1].map(c=>plantAt(ce.r,c)).find(isC);
   ok=ok&&isC(pl)&&!!fuse;
  }else if(S.sel==='nenufar')ok=ok&&!pad&&!pl;
  else if(S.sel==='rabogato')ok=ok&&!!pad&&!pl;
  else ok=ok&&!pl&&(!water||!!pad);
  if(ok){
   S.sun-=k.cost;S.cd[ck]=S.prep?0:k.cd*(S.imit?1.5:1)*(1-U.cd*.1);
   let np;
   if(S.sel==='cannon'){S.plants=S.plants.filter(q=>q!==pl&&q!==fuse);np={type:'cannon',r:ce.r,c:Math.min(pl.c,fuse.c),w2:true,hp:k.hp,t:3,arm:0}}
   else np={type:S.sel,r:ce.r,c:ce.c,hp:k.hp,t:S.sel==='girasol'?6:S.sel==='solar'?4:S.sel==='cereza'?.8:(S.sel==='jalapeno'||S.sel==='helada')?.6:0,arm:S.sel==='mina'?8:0,base:S.sel==='nenufar'};
   if(S.imit)np.imit=true;
   S.plants.push(np);S.sel=null;S.imit=false;
  }
 }
});
