name: Compilar APK

# Se ejecuta solo cuando subes cambios, o a mano desde la pestaña Actions -> "Compilar APK" -> Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # para publicar el APK en la sección Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear el proyecto Android
        working-directory: mobile
        run: |
          npm install
          rm -rf www && cp -r ../public www
          rm -f www/sw.js
          npx cap add android

      - name: Ajustes de Android (iconos y tráfico http)
        working-directory: mobile
        run: |
          # Iconos y color de fondo del launcher
          cp -r android-res/. android/app/src/main/res/
          # Permitir conexiones http/ws a la compu o al teléfono que hospeda la partida
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$MANIFEST" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          npx cap sync android

      - name: Compilar el APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar el APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk escaleras-party.apk

      - name: Guardar el APK como descarga de esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: escaleras-party-apk
          path: escaleras-party.apk

      - name: Publicar el APK en Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest escaleras-party.apk \
            --title "APK más reciente" \
            --notes "Instala escaleras-party.apk en tu Android (permite instalar apps de origen desconocido). Necesita un servidor corriendo; mira el README." 
